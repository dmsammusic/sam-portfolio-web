<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Formatter — Sam M</title>
    <meta name="description" content="Format, minify, and validate JSON data with a live editor." />
    <!-- @include "partials/theme-init.html" -->
    <link rel="stylesheet" href="/src/css/main.css" />

    <!-- Monaco editor (loaded via CDN AMD loader, not bundled — its own module system) -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/json5@2.2.3/dist/index.min.js"></script>
  </head>

  <body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">
    <!-- @include "partials/header.html" -->

    <main class="flex-1 max-w-3xl mx-auto px-4 sm:px-6 pb-20 w-full">
      <div class="pt-8 pb-6">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">JSON Formatter</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Format, minify, and validate JSON.</p>
      </div>

      <div id="editor" class="rounded-lg border border-gray-200 dark:border-gray-800" style="height: 400px"></div>

      <div class="flex gap-3 mt-4 flex-wrap items-center">
        <button onclick="formatJSON()" class="px-4 py-2 rounded-md bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition-colors">
          Format
        </button>
        <button onclick="minifyJSON()" class="nav-link border border-gray-200 dark:border-gray-800">Minify</button>
        <button onclick="clearJSON()" class="nav-link border border-gray-200 dark:border-gray-800">Clear</button>
        <button onclick="copyJSON()" class="nav-link border border-gray-200 dark:border-gray-800">Copy</button>
        <span id="msg" class="text-sm ml-2 opacity-0 transition-all duration-300"></span>
      </div>
    </main>

    <!-- @include "partials/footer.html" -->

    <script type="module" src="/src/js/nav.js"></script>
    <script type="module" src="/src/js/theme.js"></script>

    <script>
      let editor;

      require.config({
        paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs" },
      });

      require(["vs/editor/editor.main"], function () {
        const isDark = document.documentElement.classList.contains("dark");

        editor = monaco.editor.create(document.getElementById("editor"), {
          value: `{
  "userId": 1,
  "id": 1,
  "title": "sample",
  "completed": false
}`,
          language: "json",
          theme: isDark ? "vs-dark" : "vs",
          automaticLayout: true,
          fontSize: 14,
          minimap: { enabled: false },
        });

        monaco.languages.json.jsonDefaults.setDiagnosticsOptions({
          validate: true,
          allowComments: true,
        });

        editor.onDidPaste(() => {
          setTimeout(() => formatJSON(), 200);
        });
      });

      // Keep Monaco's theme in sync with the shared header's dark-mode toggle,
      // whichever page action or system-preference change flipped it.
      new MutationObserver(() => {
        if (!window.monaco || !editor) return;
        const isDark = document.documentElement.classList.contains("dark");
        monaco.editor.setTheme(isDark ? "vs-dark" : "vs");
      }).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

      function showMsg(text, type = "success") {
        const msg = document.getElementById("msg");
        msg.textContent = text;
        msg.className =
          "text-sm ml-2 transition-all duration-300 " +
          (type === "error" ? "text-red-500" : "text-green-600 dark:text-green-400");
        msg.classList.remove("opacity-0");
        setTimeout(() => msg.classList.add("opacity-0"), 1500);
      }

      function sanitizeJSON(input) {
        let fixed = input;
        fixed = fixed.replace(/"([^"]+)'\s*:/g, '"$1":');
        fixed = fixed.replace(/(\b\w+\b)\s*:/g, '"$1":');
        fixed = fixed.replace(/:\s*'([^']*)'/g, ': "$1"');
        fixed = fixed.replace(/,\s*([}\]])/g, "$1");
        return fixed;
      }

      function formatJSON() {
        try {
          let value = sanitizeJSON(editor.getValue());
          const parsed = JSON.parse(value);
          editor.setValue(JSON.stringify(parsed, null, 2));
          showMsg("Fixed & Formatted ✓");
        } catch (e) {
          showMsg("Still invalid JSON ✗", "error");
        }
      }

      function minifyJSON() {
        try {
          let value = sanitizeJSON(editor.getValue());
          const parsed = JSON.parse(value);
          editor.setValue(JSON.stringify(parsed));
          showMsg("Fixed & Minified ✓");
        } catch {
          showMsg("Invalid JSON ✗", "error");
        }
      }

      function clearJSON() {
        editor.setValue("");
        showMsg("Cleared");
      }

      function copyJSON() {
        const value = editor.getValue();
        if (!value) return;
        navigator.clipboard.writeText(value);
        showMsg("Copied ✓");
      }
    </script>
  </body>
</html>
