<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Sam M</title>
    <meta name="description" content="Edit your name and display preferences." />
    <!-- @include "partials/theme-init.html" -->
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">
    <!-- @include "partials/header.html" -->

    <main class="flex-1 max-w-md mx-auto px-4 sm:px-6 pb-20 w-full">
      <a href="/todo.html" class="nav-link -ml-3 mt-6 inline-flex">← Back to Todo List</a>

      <div class="pt-2 pb-6">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Settings</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Your name and display preferences.</p>
      </div>

      <div id="signed-out-message" class="hidden rounded-lg border border-gray-200 dark:border-gray-800 p-6 text-sm text-gray-600 dark:text-gray-300">
        Log in on the <a href="/todo.html" class="nav-link px-1">Todo List</a> to manage your settings.
      </div>

      <form id="settings-form" class="hidden rounded-lg border border-gray-200 dark:border-gray-800 p-6 space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="settings-first-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">First name</label>
            <input
              id="settings-first-name"
              type="text"
              class="w-full border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white"
            />
          </div>
          <div>
            <label for="settings-last-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Last name</label>
            <input
              id="settings-last-name"
              type="text"
              class="w-full border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white"
            />
          </div>
        </div>

        <div>
          <span class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Date format</span>
          <div class="inline-flex rounded-md border border-gray-200 dark:border-gray-800 p-0.5">
            <button type="button" class="nav-link format-tab" data-field="date_format" data-value="us" data-active="true">Jul 22 (US)</button>
            <button type="button" class="nav-link format-tab" data-field="date_format" data-value="intl">22 Jul (Intl.)</button>
          </div>
        </div>

        <div>
          <span class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Time format</span>
          <div class="inline-flex rounded-md border border-gray-200 dark:border-gray-800 p-0.5">
            <button type="button" class="nav-link format-tab" data-field="time_format" data-value="12h" data-active="true">12-hour</button>
            <button type="button" class="nav-link format-tab" data-field="time_format" data-value="24h">24-hour</button>
          </div>
        </div>

        <p id="settings-message" class="hidden text-sm"></p>

        <button type="submit" class="btn-primary">Save</button>
      </form>
    </main>

    <!-- @include "partials/footer.html" -->
    <!-- @include "partials/onboarding-modal.html" -->

    <script type="module" src="/src/js/analytics.js"></script>
    <script type="module" src="/src/js/nav.js"></script>
    <script type="module" src="/src/js/theme.js"></script>
    <script type="module" src="/src/js/user-nav.js"></script>
    <script type="module" src="/src/js/settings.js"></script>
  </body>
</html>
