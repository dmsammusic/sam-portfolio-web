<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sam M — Tools</title>
    <meta name="description" content="Small, fast developer tools by Sam Solomon Raja M — key generator, JSON formatter, and more." />
    <!-- @include "partials/theme-init.html" -->
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">
    <!-- @include "partials/header.html" -->

    <main class="flex-1 max-w-5xl mx-auto px-4 sm:px-6 pb-20 w-full">
      <h1 class="sr-only">Tools — Sam M</h1>

      <!-- SEARCH -->
      <section class="pt-10">
        <div class="relative max-w-md">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input
            id="tool-search"
            type="text"
            placeholder="Search tools…"
            class="w-full pl-9 pr-3 py-2 rounded-md border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white"
          />
        </div>
      </section>

      <!-- TOOL GRID -->
      <section class="pt-6">
        <div id="tool-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <p id="tool-empty" class="hidden text-sm text-gray-500 dark:text-gray-400 text-center py-12">
          No tools match your search.
        </p>
      </section>
    </main>

    <!-- @include "partials/footer.html" -->
    <!-- @include "partials/onboarding-modal.html" -->

    <script type="module" src="/src/js/analytics.js"></script>
    <script type="module" src="/src/js/nav.js"></script>
    <script type="module" src="/src/js/theme.js"></script>
    <script type="module" src="/src/js/user-nav.js"></script>
    <script type="module" src="/src/js/hub.js"></script>
  </body>
</html>
