<!-- Shown when logged in with no profiles row yet (existing accounts from before this
     feature existed — src/js/user-nav.js decides visibility, not any flag). -->
<div id="onboarding-toast" class="hidden fixed bottom-4 right-4 z-50 max-w-sm rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-800 shadow-lg p-4">
  <p class="text-sm text-gray-800 dark:text-gray-100 mb-3">Add your name so we know who's who.</p>
  <div class="flex gap-2">
    <button id="onboarding-toast-open" type="button" class="btn-primary text-sm px-3 py-1.5">Complete profile</button>
    <button id="onboarding-toast-dismiss" type="button" class="nav-link text-sm">Later</button>
  </div>
</div>

<div id="onboarding-modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-800 p-6 max-w-sm w-full">
    <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4">Complete your profile</h2>
    <form id="onboarding-form" class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="onboarding-first-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">First name</label>
          <input
            id="onboarding-first-name"
            type="text"
            autocomplete="given-name"
            class="w-full border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white"
          />
        </div>
        <div>
          <label for="onboarding-last-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Last name</label>
          <input
            id="onboarding-last-name"
            type="text"
            autocomplete="family-name"
            class="w-full border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white"
          />
        </div>
      </div>
      <div>
        <label for="onboarding-username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
        <input
          id="onboarding-username"
          type="text"
          autocomplete="username"
          minlength="4"
          class="w-full border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white"
        />
        <p id="onboarding-username-status" class="text-xs mt-1"></p>
      </div>

      <p id="onboarding-message" class="hidden text-sm text-red-500"></p>

      <div class="flex gap-2 pt-2">
        <button type="submit" class="btn-primary flex-1">Save</button>
        <button id="onboarding-cancel" type="button" class="nav-link">Cancel</button>
      </div>
    </form>
  </div>
</div>
