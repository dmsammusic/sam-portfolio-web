<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work End Time — Sam M</title>
    <meta name="description" content="Calculate when your 8-hour work day completes." />
    <!-- @include "partials/theme-init.html" -->
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">
    <!-- @include "partials/header.html" -->

    <main class="flex-1 max-w-md mx-auto px-4 sm:px-6 pb-20 w-full">
      <div class="pt-8 pb-6">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Work End Time</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Calculate when your 8-hour work day completes.</p>
      </div>

      <div class="rounded-lg border border-gray-200 dark:border-gray-800 p-6 space-y-4">
        <div>
          <label for="lastIn" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Last out time</label>
          <input
            id="lastIn"
            type="time"
            class="w-full border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white"
          />
        </div>

        <div>
          <label for="worked" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Worked hours</label>
          <input
            id="worked"
            type="text"
            placeholder="05:36"
            class="w-full border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 rounded-md px-3 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white"
          />
          <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">As of your last out time above.</p>
        </div>

        <p id="error-msg" class="hidden text-sm text-red-500">Enter both fields.</p>

        <button
          id="calculate"
          type="button"
          class="w-full btn-primary"
        >
          Calculate
        </button>

        <div id="output" class="hidden rounded-lg bg-gray-50 dark:bg-gray-800 p-6 text-center relative">
          <button id="format-toggle" type="button" class="hidden absolute top-3 right-3 text-xs text-gray-900 dark:text-white hover:underline">
            24-hr
          </button>
          <p class="text-sm text-gray-500 dark:text-gray-400">You can leave at</p>
          <p id="output-time" class="text-3xl font-bold text-gray-900 dark:text-white mt-1"></p>
          <p id="output-remaining" class="text-sm text-gray-500 dark:text-gray-400 mt-2"></p>
        </div>
      </div>
    </main>

    <!-- @include "partials/footer.html" -->
    <!-- @include "partials/onboarding-modal.html" -->

    <script type="module" src="/src/js/nav.js"></script>
    <script type="module" src="/src/js/theme.js"></script>
    <script type="module" src="/src/js/user-nav.js"></script>
    <script type="module" src="/src/js/time-calculator.js"></script>
  </body>
</html>
