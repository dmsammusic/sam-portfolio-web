<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Generator — Sam M</title>
    <meta name="description" content="Generate secure random keys, passwords, and hex strings for development." />
    <!-- @include "partials/theme-init.html" -->
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">
    <!-- @include "partials/header.html" -->

    <main class="flex-1 max-w-3xl mx-auto px-4 sm:px-6 pb-20 w-full">
      <div class="pt-8 pb-6 flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Key Generator</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Click any key to copy it.</p>
        </div>
        <button
          id="generate-all"
          type="button"
          class="btn-primary"
        >
          Generate new keys
        </button>
      </div>

      <div class="space-y-8">
        <section>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">Memorable Passwords</h2>
          <div class="grid gap-2 sm:grid-cols-2" id="memorable"></div>
        </section>

        <section>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">Strong Passwords</h2>
          <div class="grid gap-2 sm:grid-cols-2" id="strong"></div>
        </section>

        <section>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">Fort Knox Passwords</h2>
          <div class="grid gap-2 sm:grid-cols-2" id="fortknox"></div>
        </section>

        <section>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">CodeIgniter Keys (256-bit)</h2>
          <div class="grid gap-2 sm:grid-cols-2" id="codeigniter"></div>
        </section>

        <section>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">160-bit WPA Key</h2>
          <div class="grid gap-2 sm:grid-cols-2" id="wpa160"></div>
        </section>

        <section>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">504-bit WPA Key</h2>
          <div class="grid gap-2 sm:grid-cols-2" id="wpa504"></div>
        </section>

        <section>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">64-bit WEP Keys</h2>
          <div class="grid gap-2 sm:grid-cols-2" id="wep64"></div>
        </section>

        <section>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">128-bit WEP Keys</h2>
          <div class="grid gap-2 sm:grid-cols-2" id="wep128"></div>
        </section>

        <section>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">152-bit WEP Keys</h2>
          <div class="grid gap-2 sm:grid-cols-2" id="wep152"></div>
        </section>

        <section>
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">256-bit WEP Keys</h2>
          <div class="grid gap-2 sm:grid-cols-2" id="wep256"></div>
        </section>

        <section class="border-t border-gray-200 dark:border-gray-800 pt-6">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-3">Custom Byte Generator</h2>
          <div class="flex gap-3 flex-wrap items-center">
            <input
              id="customByteLength"
              type="number"
              min="1"
              placeholder="Byte length"
              class="border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 rounded-md px-3 py-2 text-sm w-40 focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-white"
            />
            <button
              id="generate-custom"
              type="button"
              class="btn-primary"
            >
              Generate
            </button>
          </div>
          <p id="customByteError" class="hidden text-sm text-red-500 mt-2">Enter a valid byte length.</p>
          <div class="grid gap-2 sm:grid-cols-2 mt-4" id="customBytes"></div>
        </section>
      </div>
    </main>

    <!-- @include "partials/footer.html" -->
    <!-- @include "partials/onboarding-modal.html" -->

    <script type="module" src="/src/js/nav.js"></script>
    <script type="module" src="/src/js/theme.js"></script>
    <script type="module" src="/src/js/user-nav.js"></script>
    <script type="module" src="/src/js/keygen.js"></script>
  </body>
</html>
